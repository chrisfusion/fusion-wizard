# A one-shot job from a caller-supplied container image, in catalogue form: one job WeaveApp with a
# single entrypoint that is launched once right away (the fire annotation on the create call).
# Weave's imageOverrides.allowedPrefixes (when set) restricts the image.
# Keep in step with stepstest.ImageJob (internal/chart/chart_test.go enforces it).
{{- if ((.Values.definitions | default dict).imageJob | default dict).enabled }}
apiVersion: wizard.fusion-platform.io/v1alpha1
kind: WizardDefinition
metadata:
  name: image-job
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "fusion-wizard.labels" . | nindent 4 }}
spec:
  description: "Run a one-shot job from a container image"
  parameters:
    - name: jobName
      required: true
      pattern: "^[a-z0-9-]+$"
      description: "Name of this job's app"
    - name: image
      required: true
      description: "Full image reference with an explicit tag (not latest) or a digest, within weave's allowed image prefixes"
  steps:
    - name: app
      type: app
      params:
        name: "${params.jobName}"
        type: "job"
        image: "${params.image}"
        fireOnCreate: "true"
{{- end }}
