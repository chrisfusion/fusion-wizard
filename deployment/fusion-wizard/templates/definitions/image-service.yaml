# A long-running service from a caller-supplied container image, in catalogue form: one service
# WeaveApp that owns its Deployment, Service and Ingress. Weave's imageOverrides.allowedPrefixes
# (when set) restricts the image; an empty list leaves apps unrestricted.
# Keep in step with stepstest.ImageService (internal/chart/chart_test.go enforces it).
{{- if ((.Values.definitions | default dict).imageService | default dict).enabled }}
apiVersion: wizard.fusion-platform.io/v1alpha1
kind: WizardDefinition
metadata:
  name: image-service
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "fusion-wizard.labels" . | nindent 4 }}
spec:
  description: "Deploy a long-running service from a container image"
  parameters:
    - name: serviceName
      required: true
      pattern: "^[a-z0-9-]+$"
      description: "Name of the service's app, and so of its Deployment"
    - name: image
      required: true
      description: "Full image reference with an explicit tag (not latest) or a digest, within weave's allowed image prefixes"
    - name: port
      type: number
      default: 8080
      description: "Port the service listens on"
    - name: ingressName
      default: ""
      description: "DNS label to expose the service at <ingressName>.<cluster hostSuffix> (optional)"
  steps:
    - name: app
      type: app
      params:
        name: "${params.serviceName}"
        type: "service"
        image: "${params.image}"
        port: "${params.port}"
        ingressName: "${params.ingressName}"
{{- end }}
