# Spectra's "Git BatchCron Job" wizard in catalogue form: watch a repository, wait for forge's
# build, tag it, create a job template and chain, and wire up a single BatchCron trigger from a
# pasted list of many cron-scheduled entries. No fireOnCreate — BatchCron entries each start on
# their own internal schedule (weave's own scheduler), not a one-shot fire.
# Keep in step with stepstest.BatchCronJob (internal/chart/chart_test.go enforces it).
{{- if .Values.definitions.batchCronGitJob.enabled }}
apiVersion: wizard.fusion-platform.io/v1alpha1
kind: WizardDefinition
metadata:
  name: batchcron-git-job
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "fusion-wizard.labels" . | nindent 4 }}
spec:
  description: "Build a job and wire up a BatchCron trigger from a pasted list of many cron-scheduled entries"
  parameters:
    - name: jobName
      required: true
      pattern: "^[a-z0-9-]+$"
      description: "Shared Kubernetes name for the watcher, chain, and job blueprint"
    - name: repoUrl
      required: true
      description: "Public HTTP(S) git URL"
    - name: repoRef
      default: "main"
      description: "Branch or tag to watch"
    - name: projectDir
      default: ""
      description: "Relative path containing metadata.yaml (optional)"
    - name: jobs
      required: true
      description: "YAML or JSON list of {cron, params} entries — validated by weave at creation time"
  steps:
    - name: watcher
      type: gitWatcher
      params:
        name: "${params.jobName}"
        repoUrl: "${params.repoUrl}"
        repoRef: "${params.repoRef}"
        projectDir: "${params.projectDir}"
    - name: build
      type: waitBuild
      params:
        watcher: "${steps.watcher.outputs.name}"
    - name: tag
      type: tag
      params:
        artifactId: "${steps.build.outputs.artifactId}"
        artifactName: "${steps.build.outputs.artifactName}"
        version: "${steps.build.outputs.version}"
        tag: "${config.tagName}"
    - name: template
      type: jobTemplate
      params:
        name: "${params.jobName}"
        artifactName: "${steps.build.outputs.artifactName}"
        tag: "${steps.tag.outputs.tag}"
        image: "${config.runnerImage}"
    - name: chain
      type: chain
      params:
        name: "${params.jobName}"
        jobTemplate: "${steps.template.outputs.name}"
    - name: trigger
      type: batchTrigger
      params:
        name: "${params.jobName}"
        chain: "${steps.chain.outputs.name}"
        jobs: "${params.jobs}"
{{- end }}
