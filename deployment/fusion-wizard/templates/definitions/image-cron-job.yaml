# A cron-scheduled job from a caller-supplied container image, in catalogue form: one job WeaveApp
# whose single entrypoint runs on the schedule. Weave's imageOverrides.allowedPrefixes (when set)
# restricts the image.
# Keep in step with stepstest.ImageCronJob (internal/chart/chart_test.go enforces it).
{{- if ((.Values.definitions | default dict).imageCronJob | default dict).enabled }}
apiVersion: wizard.fusion-platform.io/v1alpha1
kind: WizardDefinition
metadata:
  name: image-cron-job
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "fusion-wizard.labels" . | nindent 4 }}
spec:
  description: "Run a container image on a cron schedule"
  parameters:
    - name: jobName
      required: true
      pattern: "^[a-z0-9-]+$"
      description: "Name of this job's app"
    - name: image
      required: true
      description: "Full image reference with an explicit tag (not latest) or a digest, within weave's allowed image prefixes"
    - name: schedule
      required: true
      description: "Cron expression with seconds first (6 fields)"
  steps:
    - name: app
      type: app
      params:
        name: "${params.jobName}"
        type: "job"
        image: "${params.image}"
        schedule: "${params.schedule}"
{{- end }}
