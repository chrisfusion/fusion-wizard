{{- $api := .Values.api }}
{{- if $api.enabled }}
{{- /* Fail at render time, not as a crash-looping pod: an API with no callers named is a mistake. */}}
{{- if and (not $api.auth.allowUnauthenticated) (not $api.auth.allowedServiceAccounts) }}
{{- fail "api.auth.allowedServiceAccounts is required (e.g. [\"fusion/fusion-bff\"]); set api.auth.allowUnauthenticated=true only for local development" }}
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-api
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "fusion-wizard.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
spec:
  replicas: {{ $api.replicaCount }}
  selector:
    matchLabels:
      {{- include "fusion-wizard.api.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "fusion-wizard.api.selectorLabels" . | nindent 8 }}
        {{- with $api.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with $api.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      serviceAccountName: {{ .Release.Name }}-api
      {{- with $api.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: api-server
          image: {{ include "fusion-wizard.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["/api-server"]
          env:
            - name: API_ADDR
              value: ":{{ $api.port }}"
            - name: NAMESPACE
              value: {{ .Release.Namespace | quote }}
            - name: AUTH_ALLOWED_SA
              value: {{ join "," $api.auth.allowedServiceAccounts | quote }}
            {{- if $api.auth.audience }}
            - name: AUTH_AUDIENCE
              value: {{ $api.auth.audience | quote }}
            {{- end }}
            - name: ALLOW_UNAUTHENTICATED
              value: {{ $api.auth.allowUnauthenticated | toString | quote }}
            - name: LOG_LEVEL
              value: {{ $api.log.level | quote }}
            - name: LOG_FORMAT
              value: {{ $api.log.format | quote }}
          ports:
            - name: http
              containerPort: {{ $api.port }}
          livenessProbe:
            httpGet: {path: /healthz, port: http}
            initialDelaySeconds: 5
            periodSeconds: 20
          readinessProbe:
            httpGet: {path: /readyz, port: http}
            initialDelaySeconds: 3
            periodSeconds: 10
          resources:
            {{- toYaml $api.resources | nindent 12 }}
          {{- with $api.containerSecurityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-api
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "fusion-wizard.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
spec:
  type: {{ $api.service.type }}
  selector:
    {{- include "fusion-wizard.api.selectorLabels" . | nindent 4 }}
  ports:
    - name: http
      port: {{ $api.service.port }}
      targetPort: http
{{- if $api.ingress.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ .Release.Name }}-api
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "fusion-wizard.labels" . | nindent 4 }}
  {{- with $api.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- with $api.ingress.className }}
  ingressClassName: {{ . | quote }}
  {{- end }}
  rules:
    - host: {{ required "api.ingress.host is required when api.ingress.enabled" $api.ingress.host | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ .Release.Name }}-api
                port:
                  number: {{ $api.service.port }}
{{- end }}
{{- end }}
