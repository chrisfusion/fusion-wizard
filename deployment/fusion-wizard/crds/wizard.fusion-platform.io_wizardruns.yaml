---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.16.1
  name: wizardruns.wizard.fusion-platform.io
spec:
  group: wizard.fusion-platform.io
  names:
    kind: WizardRun
    listKind: WizardRunList
    plural: wizardruns
    shortNames:
    - wrun
    singular: wizardrun
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.definitionRef.name
      name: Definition
      type: string
    - jsonPath: .spec.desiredState
      name: Desired
      type: string
    - jsonPath: .status.phase
      name: Phase
      type: string
    - jsonPath: .spec.createdBy
      name: CreatedBy
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: WizardRun is one persistent, observable execution of a WizardDefinition.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: WizardRunSpec is one execution of a WizardDefinition.
            properties:
              createdBy:
                description: CreatedBy is the user ID forwarded by a trusted BFF (X-User-ID).
                  Stamped once at creation.
                type: string
                x-kubernetes-validations:
                - message: createdBy is immutable
                  rule: self == oldSelf
              createdByEmail:
                description: CreatedByEmail is the user email forwarded by a trusted
                  BFF (X-User-Email).
                type: string
                x-kubernetes-validations:
                - message: createdByEmail is immutable
                  rule: self == oldSelf
              definitionGeneration:
                description: DefinitionGeneration is the metadata.generation of the
                  definition the snapshot was taken from.
                format: int64
                type: integer
              definitionRef:
                description: DefinitionRef names the WizardDefinition in the same
                  namespace.
                properties:
                  name:
                    default: ""
                    description: |-
                      Name of the referent.
                      This field is effectively required, but due to backwards compatibility is
                      allowed to be empty. Instances of this type with an empty value here are
                      almost certainly wrong.
                      More info: https://kubernetes.io/docs/concepts/overview/working-with-objects/names/#names
                    type: string
                type: object
                x-kubernetes-map-type: atomic
              definitionSnapshot:
                description: |-
                  DefinitionSnapshot is a copy of the definition taken when the run starts, so editing
                  the definition later never changes a running run or its rollback. The API server fills it;
                  the controller fills it on first reconcile for runs created with kubectl.
                properties:
                  description:
                    description: Description is a human-readable summary of what the
                      wizard provisions.
                    type: string
                  parameters:
                    description: Parameters declares the inputs of the wizard.
                    items:
                      description: WizardParameter declares one user-supplied input
                        of a wizard.
                      properties:
                        default:
                          description: Default is used when the run supplies no value.
                            It takes precedence over instance config.
                          x-kubernetes-preserve-unknown-fields: true
                        description:
                          description: Description is shown by clients that render
                            a form from the definition.
                          type: string
                        name:
                          description: Name is referenced as ${params.<name>} inside
                            step params.
                          pattern: ^[A-Za-z][A-Za-z0-9_]*$
                          type: string
                        pattern:
                          description: Pattern is an optional regular expression a
                            string value must match.
                          type: string
                        required:
                          description: Required makes a run without this parameter
                            (and without a Default) invalid.
                          type: boolean
                        type:
                          default: string
                          description: Type of the value; stringList is a JSON array
                            of strings.
                          enum:
                          - string
                          - number
                          - boolean
                          - stringList
                          type: string
                      required:
                      - name
                      type: object
                    type: array
                    x-kubernetes-list-map-keys:
                    - name
                    x-kubernetes-list-type: map
                  steps:
                    description: Steps is the ordered subset of the step catalogue
                      this wizard runs.
                    items:
                      description: WizardStep selects one catalogue step and parameterises
                        it.
                      properties:
                        forEach:
                          description: |-
                            ForEach optionally expands the step once per item of a stringList, e.g. "${params.entrypoints}".
                            Each expansion sees the current item as ${item}.
                          type: string
                        name:
                          description: |-
                            Name is unique within the definition and addresses the step's outputs
                            as ${steps.<name>.outputs.<key>}.
                          maxLength: 63
                          minLength: 1
                          pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?$
                          type: string
                        params:
                          additionalProperties:
                            type: string
                          description: |-
                            Params are step-specific inputs. Values may contain ${params.x}, ${config.x},
                            ${steps.<step>.outputs.<key>} and ${item} placeholders. Unset keys fall back to instance config.
                          type: object
                        type:
                          description: Type selects the catalogue step.
                          enum:
                          - gitWatcher
                          - waitBuild
                          - tag
                          - jobTemplate
                          - chain
                          - trigger
                          - batchTrigger
                          type: string
                      required:
                      - name
                      - type
                      type: object
                    minItems: 1
                    type: array
                    x-kubernetes-list-map-keys:
                    - name
                    x-kubernetes-list-type: map
                required:
                - steps
                type: object
              desiredState:
                default: Applied
                description: DesiredState is Applied (default) or RolledBack.
                enum:
                - Applied
                - RolledBack
                type: string
              parameters:
                additionalProperties:
                  x-kubernetes-preserve-unknown-fields: true
                description: |-
                  Parameters are the caller's inputs, keyed by parameter name. Scalars are JSON strings,
                  numbers or booleans; stringList values are JSON arrays of strings.
                type: object
            required:
            - definitionRef
            type: object
          status:
            description: WizardRunStatus is the observed state of a WizardRun.
            properties:
              completedAt:
                description: CompletedAt is when the run reached Ready, Failed, RolledBack
                  or RollbackFailed.
                format: date-time
                type: string
              conditions:
                description: Conditions follow the standard Kubernetes condition convention;
                  Ready is the only one used.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              message:
                description: Message is a human-readable summary of the phase, e.g.
                  the failing step's error.
                type: string
              observedGeneration:
                description: ObservedGeneration is the spec generation the controller
                  last acted on.
                format: int64
                type: integer
              phase:
                description: Phase is the overall run state.
                enum:
                - Pending
                - Running
                - Ready
                - Failed
                - RollingBack
                - RolledBack
                - RollbackFailed
                type: string
              startedAt:
                description: StartedAt is when the run first started applying.
                format: date-time
                type: string
              steps:
                description: Steps reports every step instance in execution order.
                items:
                  description: WizardRunStepStatus reports one step instance. A step
                    with forEach yields one entry per item.
                  properties:
                    completedAt:
                      description: CompletedAt is when the step reached a terminal
                        phase.
                      format: date-time
                      type: string
                    failures:
                      description: Failures counts consecutive transient failures;
                        the step fails for good after too many.
                      format: int32
                      type: integer
                    item:
                      description: Item is the forEach item this instance was expanded
                        for.
                      type: string
                    key:
                      description: 'Key is unique within the run: the step name, or
                        "<name>/<item>" for forEach expansions.'
                      type: string
                    message:
                      description: Message carries the last error or progress detail.
                      type: string
                    name:
                      description: Name is the step name from the definition.
                      type: string
                    outputs:
                      additionalProperties:
                        type: string
                      description: Outputs are values later steps can reference as
                        ${steps.<name>.outputs.<key>}.
                      type: object
                    phase:
                      description: Phase is the current state of the step instance.
                      enum:
                      - Pending
                      - Running
                      - Succeeded
                      - Failed
                      - RolledBack
                      - RollbackFailed
                      type: string
                    resources:
                      description: Resources are the upstream resources this step
                        instance holds a ledger reference to.
                      items:
                        description: ManagedResourceRef points a run step at one upstream
                          resource.
                        properties:
                          disposition:
                            description: Disposition is how this run obtained the
                              resource.
                            enum:
                            - Created
                            - Adopted
                            - FoundUnowned
                            type: string
                          externalID:
                            description: ExternalID is the upstream's numeric or opaque
                              ID when the name is not enough (e.g. index artifact
                              ID).
                            type: string
                          kind:
                            description: Kind is the upstream resource kind, e.g.
                              "gitwatcher", "artifact", "jobtemplate".
                            type: string
                          name:
                            description: Name is the resource name at the upstream.
                            type: string
                          service:
                            description: Service is the upstream that owns the resource.
                            enum:
                            - forge
                            - index
                            - weave
                            type: string
                        required:
                        - disposition
                        - kind
                        - name
                        - service
                        type: object
                      type: array
                    startedAt:
                      description: StartedAt is when the step first ran; waitBuild
                        measures its timeout from here.
                      format: date-time
                      type: string
                    type:
                      description: Type is the catalogue step type.
                      enum:
                      - gitWatcher
                      - waitBuild
                      - tag
                      - jobTemplate
                      - chain
                      - trigger
                      - batchTrigger
                      type: string
                  required:
                  - key
                  - name
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - key
                x-kubernetes-list-type: map
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
